metadata:
  title: 基金架构图生成
  short title: 基金架构图
  description: 通过问答收集基金主体、出资人、管理人、托管人与底层项目，生成中基协备案风格的基金架构图（SVG）。
  authors:
    - name: skillhub
---
features:
  navigation: True
  progress bar: True
  question back button: True
---
sections:
  - basics: 基金信息
  - partners_section: 出资人
  - parties: 管理人与托管人
  - projects_section: 底层项目
  - result: 生成结果
---
modules:
  - .fund_svg
---
objects:
  - partners: DAList.using(object_type=DAObject, there_are_any=True, complete_attribute='complete')
  - projects: DAList.using(object_type=DAObject, there_are_any=True, complete_attribute='complete')
  - svg_file: DAFile
  - json_file: DAFile
---
mandatory: True
code: |
  intro_seen
  diagram_title
  fund_name
  nav.set_section('partners_section')
  partners.gather()
  nav.set_section('parties')
  has_manager
  has_custodian
  nav.set_section('projects_section')
  has_projects
  if has_projects:
    projects.gather()
  else:
    projects.clear()
  project_label
  nav.set_section('result')
  final_screen
---
question: 基金架构图生成器
subquestion: |
  本问答将依次询问：

  1. 基金名称与组织形式；
  2. 出资人（GP / LP 等）及认缴金额——认缴比例按金额自动计算，合计恰为 100.00%；
  3. 基金管理人（含登记编码）与托管银行；
  4. 底层投资项目。

  完成后可在线预览并下载 **SVG** 架构图，以及可复用的 **JSON** 数据文件。
field: intro_seen
continue button label: 开始
section: basics
---
question: 基金类型
fields:
  - 架构图标题: diagram_title
    default: 中基协备案基金架构图
  - 基金组织形式: fund_type
    datatype: radio
    choices:
      - 合伙型: partnership
      - 公司型: company
      - 契约型: contract
    default: partnership
  - 金额单位: unit
    default: 万元
section: basics
---
reconsider: True
code: |
  if fund_type == 'partnership':
    investor_word = '合伙人'
    default_form_text = '合伙企业（有限合伙）'
    fund_type_text = '合伙型'
  elif fund_type == 'company':
    investor_word = '股东'
    default_form_text = '有限责任公司'
    fund_type_text = '公司型'
  else:
    investor_word = '基金份额持有人'
    default_form_text = '契约型私募基金'
    fund_type_text = '契约型'
---
question: 基金主体
subquestion: |
  基金方框为灰底，第一行显示名称，第二行显示组织形式。
fields:
  - 基金名称: fund_name
    hint: 例如：F 基金
  - 组织形式（方框第二行）: fund_form_text
    default: ${ default_form_text }
    required: False
section: basics
---
question: |
  第 ${ i + 1 } 位${ investor_word }
subquestion: |
  上排方框自左向右按录入顺序排列。GP 方框自动灰底。
fields:
  - 名称: partners[i].name
  - 身份: partners[i].role
    datatype: radio
    choices:
      - GP（普通合伙人）: GP
      - LP（有限合伙人）: LP
    default: ${ 'GP' if i == 0 else 'LP' }
  - 认缴金额（${ unit }）: partners[i].amount
    datatype: number
    min: 0
if: fund_type == 'partnership'
section: partners_section
---
question: |
  第 ${ i + 1 } 位${ investor_word }
fields:
  - 名称: partners[i].name
  - 认缴 / 认购金额（${ unit }）: partners[i].amount
    datatype: number
    min: 0
if: fund_type != 'partnership'
section: partners_section
---
code: |
  if fund_type != 'partnership':
    partners[i].role = ''
  partners[i].name
  partners[i].role
  partners[i].amount
  partners[i].complete = True
---
question: |
  还有其他${ investor_word }吗？
subquestion: |
  已录入 ${ partners.number() } 位，合计认缴 ${ format_amount(sum(p.amount for p in partners)) } ${ unit }：

  ${ partners.table }
yesno: partners.there_is_another
section: partners_section
---
table: partners.table
rows: partners
columns:
  - 名称: row_item.name
  - 身份: row_item.role
  - 认缴金额: format_amount(row_item.amount)
edit:
  - name
delete buttons: True
---
question: 基金管理人
subquestion: |
  管理人方框位于基金左侧，以箭头指向基金。
fields:
  - 是否画出基金管理人: has_manager
    datatype: yesnoradio
    default: True
  - 管理人名称: manager_name
    show if: has_manager
  - 登记编码: manager_code
    hint: 例如：P1000000
    required: False
    show if: has_manager
  - 连线标注: manager_label
    default: 受托管理
    show if: has_manager
validation code: |
  if has_manager and manager_code and not manager_code.strip().upper().startswith('P'):
    validation_error('私募基金管理人登记编码通常以 P 开头，请核对。', field='manager_code')
section: parties
---
question: 托管银行
subquestion: |
  托管人方框位于基金右侧，以箭头指向基金。
fields:
  - 是否画出托管银行: has_custodian
    datatype: yesnoradio
    default: True
  - 托管人名称: custodian_name
    show if: has_custodian
  - 连线标注: custodian_label
    default: 资金托管
    show if: has_custodian
section: parties
---
question: 底层项目
fields:
  - 是否画出底层项目: has_projects
    datatype: yesnoradio
    default: True
  - 项目连线标注: project_label
    default: 项目投资
    show if: has_projects
section: projects_section
---
code: |
  if not has_projects:
    project_label = ''
---
question: |
  第 ${ i + 1 } 个底层项目
subquestion: |
  只画一个项目时可直接填「底层项目」；多个项目会分叉排成一行。
fields:
  - 项目名称: projects[i].name
    default: ${ '底层项目' if i == 0 else '' }
  - 方框内补充说明: projects[i].note
    hint: 可选，例如：（拟投）
    required: False
  - 箭头旁标注: projects[i].label
    hint: 可选，例如：持股 10%
    required: False
section: projects_section
---
code: |
  projects[i].name
  projects[i].complete = True
---
question: 还有其他底层项目吗？
subquestion: |
  ${ projects.table }
yesno: projects.there_is_another
section: projects_section
---
table: projects.table
rows: projects
columns:
  - 项目名称: row_item.name
  - 补充说明: row_item.note
  - 箭头标注: row_item.label
edit:
  - name
delete buttons: True
---
reconsider: True
code: |
  diagram_data = interview_to_data(
    title=diagram_title,
    unit=unit,
    fund_name=fund_name,
    fund_form_text=fund_form_text,
    partners=partners,
    projects=projects if has_projects else [],
    project_label=project_label,
    has_manager=has_manager,
    manager_name=manager_name if has_manager else '',
    manager_code=manager_code if has_manager else '',
    manager_label=manager_label if has_manager else '',
    has_custodian=has_custodian,
    custodian_name=custodian_name if has_custodian else '',
    custodian_label=custodian_label if has_custodian else '',
  )
  diagram_warnings = check(diagram_data)
  svg_file.initialize(filename='fund_structure.svg')
  svg_file.write(render_svg(diagram_data))
  svg_file.commit()
  json_file.initialize(filename='fund_structure.json')
  json_file.write(to_json(diagram_data))
  json_file.commit()
  files_ready = True
---
event: final_screen
need: files_ready
question: 基金架构图已生成
subquestion: |
  % if diagram_warnings:
  **请核对：**

  % for msg in diagram_warnings:
  * ${ msg }
  % endfor

  % endif
  ${ svg_file.show(width='100%') }

  ${ action_button_html(svg_file.url_for(attachment=True), label='下载 SVG', icon='download', color='primary') }
  ${ action_button_html(json_file.url_for(attachment=True), label='下载 JSON 数据', icon='file-code', color='secondary') }
  ${ action_button_html(url_action('review_answers'), label='修改答案', icon='pencil-alt', color='info') }

  JSON 数据可交给 skill 的 `scripts/render_svg.py` 重新出图或导出 PNG。
---
event: review_answers
question: 修改答案
subquestion: 修改后返回即可重新生成架构图。
review:
  - Edit: diagram_title
    button: |
      **标题 / 类型 / 单位：** ${ diagram_title }；${ fund_type_text }；${ unit }
  - Edit: fund_name
    button: |
      **基金：** ${ fund_name } ${ fund_form_text }
  - Edit: partners.revisit
    button: |
      **${ investor_word }：**

      ${ partners.table }
  - Edit: has_manager
    button: |
      **管理人：** ${ manager_name + '（' + manager_code + '）' if has_manager else '不画' }
  - Edit: has_custodian
    button: |
      **托管人：** ${ custodian_name if has_custodian else '不画' }
  - Edit: has_projects
    button: |
      **底层项目：** ${ '、'.join(p.name for p in projects) if has_projects else '不画' }
  - Edit: projects.revisit
    show if: has_projects
    button: |
      编辑项目列表
---
question: 编辑${ investor_word }
subquestion: |
  ${ partners.table }

  ${ partners.add_action(label='添加' + investor_word) }
continue button field: partners.revisit
---
question: 编辑底层项目
subquestion: |
  ${ projects.table }

  ${ projects.add_action(label='添加项目') }
continue button field: projects.revisit
